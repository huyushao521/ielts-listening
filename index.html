<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思听力笔记 · 按真题集整理</title>
    <meta name="description" content="按剑桥雅思真题集（C4–C19）整理的听力高频同义替换，支持关键词搜索">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
</head>
<body>
    <nav class="topnav">
        <div class="nav-inner">
            <a href="index.html" class="brand">🎧 IELTS Listening Notes</a>
            <div class="nav-links">
                <a href="index.html">按真题集</a>
                <a href="vocabulary.html">同义替换总表</a>
                <a href="https://github.com/huyushao521/ielts-listening">GitHub</a>
            </div>
        </div>
    </nav>

    <header class="page-header">
        <h1>🎧 雅思听力 · 按真题集整理</h1>
        <p>剑雅 C4–C19 高频同义替换，按册归纳 · 共 <span id="total">0</span> 条</p>
    </header>

    <main class="content">

        <div class="search-wrap">
            <input id="q" class="search-box" type="search" autocomplete="off"
                   placeholder="搜索：听到的词 / 题目里的词 / 场景，如 deposit、预订、S4">
            <p class="search-hint" id="hint">支持中英文关键词，输入即时过滤</p>
        </div>

        <nav class="toc">
            <h3>快速跳转</h3>
            <div class="chip-row" id="toc"></div>
        </nav>

        <div id="app"></div>

        <p class="disclaimer">
            说明：本页为个人备考笔记，条目按各册听力高频场景与同义替换规律归纳，若与真题原文有出入，以真题为准。
            有新条目可直接在 <code>assets/data-*.js</code> 里追加，刷新页面即可生效。
        </p>

    </main>

    <footer class="footer">
        <p>&copy; 2026 <a href="https://github.com/huyushao521">huyushao521</a> · MIT License</p>
    </footer>

    <script src="assets/data-15-19.js"></script>
    <script src="assets/data-10-14.js"></script>
    <script src="assets/data-4-9.js"></script>
    <script>
        (function () {
            var books = window.IELTS_BOOKS || [];
            var app = document.getElementById('app');
            var toc = document.getElementById('toc');
            var q = document.getElementById('q');
            var hint = document.getElementById('hint');
            var total = 0;

            books.forEach(function (b) { total += b.v.length; });
            document.getElementById('total').textContent = total;

            toc.innerHTML = books.map(function (b) {
                return '<a class="chip" href="#' + b.id + '">剑雅 ' + b.id.slice(1) + ' <span class="chip-n">' + b.v.length + '</span></a>';
            }).join('');

            app.innerHTML = books.map(function (b) {
                var rows = b.v.map(function (r) {
                    return '<tr>' +
                        '<td><span class="pos">' + r[2] + '</span></td>' +
                        '<td><b>' + r[0] + '</b></td>' +
                        '<td>' + r[1] + '</td>' +
                        '<td>' + r[3] + '</td>' +
                        '</tr>';
                }).join('');
                return '<section class="book" id="' + b.id + '">' +
                    '<div class="book-head"><h2>剑雅 ' + b.id.slice(1) + '</h2>' +
                    '<span class="book-year">' + b.year + ' · ' + b.v.length + ' 条</span></div>' +
                    (b.note ? '<p class="book-note">' + b.note + '</p>' : '') +
                    '<table class="vocab-table">' +
                    '<thead><tr><th style="width:9%">位置</th><th style="width:27%">听力原文（听到）</th>' +
                    '<th style="width:30%">题目 / 选项（看到）</th><th>说明 / 场景</th></tr></thead>' +
                    '<tbody>' + rows + '</tbody></table>' +
                    '</section>';
            }).join('');

            var sections = [].slice.call(document.querySelectorAll('.book'));

            q.addEventListener('input', function () {
                var kw = q.value.trim().toLowerCase();
                var shown = 0;

                sections.forEach(function (sec) {
                    var visible = 0;
                    [].slice.call(sec.querySelectorAll('tbody tr')).forEach(function (tr) {
                        var hit = !kw || tr.textContent.toLowerCase().indexOf(kw) > -1;
                        tr.style.display = hit ? '' : 'none';
                        if (hit) visible++;
                    });
                    sec.style.display = visible ? '' : 'none';
                    shown += visible;
                });

                hint.textContent = kw
                    ? (shown ? '匹配 ' + shown + ' 条' : '没有匹配结果，换个关键词试试')
                    : '支持中英文关键词，输入即时过滤';
            });
        })();
    </script>
</body>
</html>
